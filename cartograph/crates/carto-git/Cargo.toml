[package]
name = "carto-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
carto-model = { workspace = true }
carto-store = { workspace = true }
anyhow = { workspace = true }
# git2 for history mining (H3). `vendored-libgit2` builds libgit2 from source so
# we don't depend on a system lib being present.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
